<!DOCTYPE html>   
<head>    
<title>Sprawdzenie danych Pylypiuk </title>    
<meta charset="utf-8">   
</head>  
<body> 
<div style="color:red;font-size:50px;"> 
<script language="JavaScript"> 
do { 
var liczba1_p=prompt("wysokość=",""); 
var h_p=parseFloat(liczba1_p); 
} 
while ( h_p<=0); 
do { 
var liczba2_p=prompt("podstawę=",""); 
var a_p=parseFloat(liczba2_p); 
} 
while(!( a_p>0)); 
var Pole_p=a_p*h_p/2; 
document.write("Pole="+Pole_p.toFixed(2)+" cm^2"+"<br>"); 
</script> 
</div> 
</body> 
</html>
