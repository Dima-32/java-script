<!DOCTYPE html>   
<head>    
<title>Sprawdzenie danych Pylypiuk </title>    
<meta charset="utf-8">   
</head>  
<body> 
<div style="color:red;font-size:50px;"> 
<script language="JavaScript"> 
let n_pyl = parseFloat(prompt("Podaj liczbę: "));
let wynik_pyl = n_pyl;
if(n_pyl == 0){
document.write("Wynik " + n_pyl + "! jest: 1");
}
else if(n_pyl > 0){
for(i = n_pyl - 1; i>0; i--){
wynik_pyl = wynik_pyl * i;
}
document.write("Wynik " + n_pyl + "! jest: " + wynik_pyl);
}
else{
document.write("Liczba nie może być mniejsza od zera");
}
</script> 
</div> 
</body> 
</html>
