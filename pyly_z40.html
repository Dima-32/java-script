<!DOCTYPE html>  
<html lang="pl-PL">  
<title> Z40 Pylypiuk</title> 
<body> 
 <div style="color:red;font-size:50px;"> 
    <script language="JavaScript"> 
  var x=prompt("podaj argument x=",""); 
               var x_pyl=parseFloat(x); 
document.write("wykonał Dmytro Pylypiuk"+"<br>"); 
    document.write("czytany argument x="+x_pyl+"<br>");     
 
                 function f_pyl(x_pyl) { 
                            if(x_pyl>=1) {return 1;} 
                            if((x_pyl=>-2)&&(x_pyl<1)) {return x_pyl*x_pyl;} 
                            if(x_pyl<-2) {return 4;} 
                  } 
 
               document.write("f("+x_pyl+")="+f_pyl(x_pyl)+"<br>"); 
 
           </script> 
 </div> 
 </body> 
</html>
